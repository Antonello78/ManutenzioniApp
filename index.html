<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolo Manodopera - Ditta D'Angelo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fc; }
    @media print {
        .no-print { display: none !important; }
        #app { box-shadow: none !important; border: none !important; width: 100%; margin: 0; transform: scale(0.9); transform-origin: top left; }
    }
</style>
</head>
<body class="p-4 sm:p-8">
    <div id="app" class="max-w-xl mx-auto bg-white shadow-2xl rounded-xl p-6">
        
        <div id="unified-header" class="mb-6 border-b pb-2 text-center no-print">
            <img src="LOGO ANTONELLO.png" alt="Logo" class="h-20 mx-auto mb-2">
            <p class="text-xs text-gray-400">Versione Stabile 1.1.6</p>
        </div>
        
        <div id="input-section">
            <div class="flex justify-between items-center mb-4 no-print">
                <h2 class="text-xl font-bold text-gray-700">Dettagli Intervento</h2>
                <button onclick="nuovoIntervento()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-blue-700 transition">
                    + NUOVO / PULISCI
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">N° Intervento</label>
                    <input type="text" id="nIntervento" class="mt-1 w-full px-3 py-2 border rounded-lg bg-gray-50 font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Data</label>
                    <input type="date" id="dataIntervento" onchange="calcolaManodopera()" class="mt-1 w-full px-3 py-2 border rounded-lg">
                </div>
            </div>

            <div class="mt-4">
                <label class="block text-xs font-bold text-gray-500 uppercase">Scuola</label>
                <input type="text" id="nomeScuola" oninput="calcolaManodopera()" class="mt-1 w-full px-3 py-2 border rounded-lg" placeholder="Es: G. Pascoli">
            </div>

            <div class="mt-4">
                <label class="block text-xs font-bold text-gray-500 uppercase">Plesso/Edificio</label>
                <input type="text" id="plessoEdificio" oninput="calcolaManodopera()" class="mt-1 w-full px-3 py-2 border rounded-lg" placeholder="Es: Sede Centrale">
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Inizio</label>
                    <input type="time" id="oraInizio" value="09:00" onchange="calcolaManodopera()" class="mt-1 w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Fine</label>
                    <input type="time" id="oraFine" value="10:15" onchange="calcolaManodopera()" class="mt-1 w-full px-3 py-2 border rounded-lg">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 mt-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Operai</label>
                    <input type="number" id="numOperai" value="1" min="1" onchange="calcolaManodopera()" class="mt-1 w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Uscita €</label>
                    <input type="number" id="inputCostoUscita" value="75" onchange="calcolaManodopera()" class="mt-1 w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Tariffa €/h</label>
                    <input type="number" id="inputTariffaBase" value="38" onchange="calcolaManodopera()" class="mt-1 w-full px-3 py-2 border rounded-lg">
                </div>
            </div>

            <div class="mt-4 p-3 bg-red-50 rounded-lg flex items-center">
                <input id="flagUrgenza" type="checkbox" onchange="calcolaManodopera()" class="h-5 w-5 text-red-600">
                <label for="flagUrgenza" class="ml-3 text-sm font-bold text-red-700 uppercase">Urgenza Immediata (+10€/h)</label>
            </div>

            <div class="mt-6 p-4 border-2 border-dashed rounded-xl bg-gray-50">
                <div class="flex justify-between text-sm mb-1">
                    <span class="text-gray-500">N° Interv / Data:</span>
                    <span id="resInfo" class="font-bold">---</span>
                </div>
                <div class="flex justify-between text-sm mb-1">
                    <span class="text-gray-500">Scuola:</span>
                    <span id="resScuola" class="font-bold">---</span>
                </div>
                <div class="flex justify-between text-sm border-b pb-2 mb-2">
                    <span class="text-gray-500">Tempo Fatturabile:</span>
                    <span id="resTempo" class="font-bold text-blue-600">---</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xl font-black text-gray-700">TOTALE:</span>
                    <span id="resTotale" class="text-3xl font-black text-blue-700">75,00 €</span>
                </div>
            </div>
        </div>

        <div id="msg" class="mt-4 p-3 rounded-lg hidden text-center font-bold no-print"></div>

        <div id="archivioSection" class="hidden mt-4 no-print">
            <h3 class="font-bold text-lg mb-2">📂 Archivio Interventi</h3>
            <div id="anniFiltro" class="flex gap-2 mb-3"></div>
            <input type="text" id="search" onkeyup="renderArchivio()" placeholder="Cerca scuola..." class="w-full p-2 border rounded-lg mb-3">
            <div id="lista" class="space-y-2 max-h-80 overflow-y-auto"></div>
        </div>

        <div class="mt-6 flex flex-col gap-3 no-print">
            <button onclick="salvaIntervento()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-green-700">SALVA INTERVENTO</button>
            <div class="flex gap-2">
                <button onclick="stampaRiepilogo()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700">STAMPA PDF</button>
                <button onclick="toggleArchivio()" id="btnArc" class="flex-1 bg-gray-500 text-white font-bold py-3 rounded-lg">ARCHIVIO</button>
            </div>
        </div>
    </div>

    <div id="modalCopia" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg">
            <div class="p-4 border-b font-bold text-lg">Revisione Riga Preventivo</div>
            <div class="p-4">
                <textarea id="testoModale" rows="10" class="w-full p-3 border rounded-lg font-mono text-sm bg-gray-50"></textarea>
            </div>
            <div class="p-4 flex gap-3">
                <button onclick="copiaTesto()" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg">COPIA ORA</button>
                <button onclick="chiudiModal()" class="flex-1 bg-gray-200 py-2 rounded-lg font-bold">CHIUDI</button>
            </div>
        </div>
    </div>

    <script>
        const KEY = 'manodoperaInterventi';
        let annoCorrente = new Date().getFullYear().toString().substring(2);

        function showMsg(txt, isErr=false) {
            const m = document.getElementById('msg');
            m.textContent = txt;
            m.className = `mt-4 p-3 rounded-lg font-bold text-center ${isErr ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            m.classList.remove('hidden');
            setTimeout(() => m.classList.add('hidden'), 3000);
        }

        function calcolaManodopera() {
            const ini = document.getElementById('oraInizio').value;
            const fin = document.getElementById('oraFine').value;
            const nOp = parseInt(document.getElementById('numOperai').value) || 1;
            const base = parseFloat(document.getElementById('inputTariffaBase').value) || 38;
            const usc = parseFloat(document.getElementById('inputCostoUscita').value) || 0;
            const urg = document.getElementById('flagUrgenza').checked;

            const [h1, m1] = ini.split(':').map(Number);
            const [h2, m2] = fin.split(':').map(Number);
            const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            
            if (diff <= 0) return;

            const minTot = diff * nOp;
            const minFatt = Math.ceil(minTot / 15) * 15;
            const tarff = urg ? base + 10 : base;
            const costoAgg = (Math.max(0, minFatt - 60) / 60) * tarff;
            const tot = usc + costoAgg;

            document.getElementById('resTempo').textContent = `${minFatt} min (${(minFatt/60).toFixed(2).replace('.',',')} ore)`;
            document.getElementById('resTotale').textContent = tot.toFixed(2).replace('.',',') + ' €';
            document.getElementById('resInfo').textContent = document.getElementById('nIntervento').value + " del " + document.getElementById('dataIntervento').value;
            document.getElementById('resScuola').textContent = document.getElementById('nomeScuola').value || "---";
        }

        function nuovoIntervento() {
            document.getElementById('nomeScuola').value = '';
            document.getElementById('plessoEdificio').value = '';
            document.getElementById('flagUrgenza').checked = false;
            // Incremento numero
            const nAttuale = document.getElementById('nIntervento').value.split('/')[0];
            const nuovoN = (parseInt(nAttuale) + 1).toString().padStart(3, '0');
            document.getElementById('nIntervento').value = `${nuovoN}/${annoCorrente}`;
            calcolaManodopera();
            showMsg("Campi resettati. Pronto per nuovo intervento.");
        }

        async function salvaIntervento() {
            const data = {
                id: Date.now().toString(),
                nIntervento: document.getElementById('nIntervento').value,
                dataIntervento: document.getElementById('dataIntervento').value,
                nomeScuola: document.getElementById('nomeScuola').value,
                plessoEdificio: document.getElementById('plessoEdificio').value,
                oraInizio: document.getElementById('oraInizio').value,
                oraFine: document.getElementById('oraFine').value,
                numOperai: document.getElementById('numOperai').value,
                costoUscita: document.getElementById('inputCostoUscita').value,
                tariffaBase: document.getElementById('inputTariffaBase').value,
                flagUrgenza: document.getElementById('flagUrgenza').checked,
                totale: document.getElementById('resTotale').textContent
            };

            let inv = JSON.parse(localStorage.getItem(KEY) || '[]');
            const idx = inv.findIndex(x => x.nIntervento === data.nIntervento);
            if(idx > -1) inv[idx] = data; else inv.push(data);
            
            localStorage.setItem(KEY, JSON.stringify(inv));
            localStorage.setItem('ultimoNumero_'+annoCorrente, data.nIntervento.split('/')[0]);
            
            showMsg("Intervento Salvato con Successo!");
            renderArchivio();
        }

        function caricaIntervento(id) {
            const item = JSON.parse(localStorage.getItem(KEY)).find(x => x.id === id);
            document.getElementById('nIntervento').value = item.nIntervento;
            document.getElementById('dataIntervento').value = item.dataIntervento;
            document.getElementById('nomeScuola').value = item.nomeScuola;
            document.getElementById('plessoEdificio').value = item.plessoEdificio;
            document.getElementById('oraInizio').value = item.oraInizio;
            document.getElementById('oraFine').value = item.oraFine;
            document.getElementById('numOperai').value = item.numOperai;
            document.getElementById('inputCostoUscita').value = item.costoUscita;
            document.getElementById('inputTariffaBase').value = item.tariffaBase;
            document.getElementById('flagUrgenza').checked = item.flagUrgenza;
            calcolaManodopera();
            toggleArchivio();
            showMsg("Intervento caricato per modifica.");
        }

        function renderArchivio() {
            const list = document.getElementById('lista');
            const search = document.getElementById('search').value.toLowerCase();
            const inv = JSON.parse(localStorage.getItem(KEY) || '[]');
            const filtrati = inv.filter(x => x.nomeScuola.toLowerCase().includes(search));
            
            list.innerHTML = filtrati.map(i => `
                <div class="p-3 border rounded-lg bg-white shadow-sm flex justify-between items-center">
                    <div>
                        <div class="font-bold text-blue-800">#${i.nIntervento}</div>
                        <div class="text-sm font-semibold">${i.nomeScuola}</div>
                        <div class="text-xs text-gray-500">${i.dataIntervento} - ${i.totale}</div>
                    </div>
                    <div class="flex gap-2">
                        <button title="Copia Riga Preventivo" onclick="apriCopia('${i.id}')" class="p-2 bg-blue-50 rounded">📋</button>
                        <button title="Carica e Modifica" onclick="caricaIntervento('${i.id}')" class="p-2 bg-gray-50 rounded">✏️</button>
                    </div>
                </div>
            `).join('');
        }

        function apriCopia(id) {
            const i = JSON.parse(localStorage.getItem(KEY)).find(x => x.id === id);
            const d = i.dataIntervento.split('-').reverse().join('/');
            let t = `Rif. Intervento n. ${i.nIntervento} del ${d} presso ${i.nomeScuola}.\n${i.flagUrgenza ? 'URGENZA IMMEDIATA' : 'Manutenzione ordinaria'}: orario ${i.oraInizio}-${i.oraFine}, n. ${i.numOperai} op.\nImporto totale: € ${i.totale}`;
            document.getElementById('testoModale').value = t;
            document.getElementById('modalCopia').classList.remove('hidden');
        }

        function chiudiModal() { document.getElementById('modalCopia').classList.add('hidden'); }
        function copiaTesto() {
            navigator.clipboard.writeText(document.getElementById('testoModale').value);
            showMsg("Testo copiato!");
            chiudiModal();
        }

        function toggleArchivio() {
            const arc = document.getElementById('archivioSection');
            const inp = document.getElementById('input-section');
            arc.classList.toggle('hidden');
            inp.classList.toggle('hidden');
            document.getElementById('btnArc').textContent = arc.classList.contains('hidden') ? 'ARCHIVIO' : 'TORNA SU';
            if(!arc.classList.contains('hidden')) renderArchivio();
        }

        function stampaRiepilogo() {
            const tit = `Intervento_${document.getElementById('nIntervento').value.replace('/','-')}_${document.getElementById('nomeScuola').value}`;
            document.title = tit;
            window.print();
        }

        window.onload = () => {
            const u = localStorage.getItem('ultimoNumero_'+annoCorrente) || "074";
            document.getElementById('nIntervento').value = (parseInt(u)+1).toString().padStart(3,'0') + "/" + annoCorrente;
            document.getElementById('dataIntervento').valueAsDate = new Date();
            calcolaManodopera();
        };
    </script>
</body>
</html>
